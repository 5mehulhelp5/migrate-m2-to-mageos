name: update-mage-os-version.yaml
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'   # daily 04:00 UTC

permissions:
  contents: read

jobs:
  update-mage-os-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve current and latest Mage-OS version
        id: versions
        run: |
          set -euo pipefail

          current=$(sed -n 's/^TARGET_VERSION="\(.*\)"$/\1/p' migrate-to-mage-os.sh)
          if [[ -z "$current" ]]; then
            echo "::error::Could not read TARGET_VERSION from migrate-to-mage-os.sh"
            exit 1
          fi

          # Stable releases only: anything with a suffix (-beta, -rc, -p1, ...) is skipped.
          latest=$(curl -fsSL https://repo.mage-os.org/p2/mage-os/product-community-edition.json \
            | jq -r '.packages["mage-os/product-community-edition"][].version' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n 1)
          if [[ -z "$latest" ]]; then
            echo "::error::Could not determine the latest Mage-OS version from repo.mage-os.org"
            exit 1
          fi

          echo "Current: $current"
          echo "Latest:  $latest"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

          if [[ "$current" == "$latest" ]]; then
            echo "Already on the latest version"
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Never downgrade: only act when the repository actually offers something newer.
          newest=$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n 1)
          if [[ "$newest" != "$latest" ]]; then
            echo "::warning::Pinned version $current is newer than the latest published $latest, nothing to do"
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "needs_update=true" >> "$GITHUB_OUTPUT"

      - name: Check whether the update pull request already exists
        id: existing
        if: steps.versions.outputs.needs_update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automated/mage-os-${{ steps.versions.outputs.latest }}
        run: |
          set -euo pipefail
          number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // ""')
          if [[ -n "$number" ]]; then
            echo "Pull request #${number} is already open for ${BRANCH}"
            echo "https://github.com/${GITHUB_REPOSITORY}/pull/${number}" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "pr_number=$number" >> "$GITHUB_OUTPUT"

      - name: Push the version bump and open the pull request
        if: steps.versions.outputs.needs_update == 'true' && steps.existing.outputs.pr_number == ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automated/mage-os-${{ steps.versions.outputs.latest }}
          CURRENT: ${{ steps.versions.outputs.current }}
          LATEST: ${{ steps.versions.outputs.latest }}
        run: |
          set -euo pipefail

          sed -i "s/^TARGET_VERSION=\".*\"$/TARGET_VERSION=\"${LATEST}\"/" migrate-to-mage-os.sh

          if git diff --quiet -- migrate-to-mage-os.sh; then
            echo "::error::TARGET_VERSION replacement produced no change"
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git commit -am "Update Mage-OS target version to ${LATEST}"
          # Force is safe here: this step only runs when no pull request is open for the branch,
          # so anything already on it is a leftover from an earlier failed run of this job.
          git push --force origin "$BRANCH"

          if gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "$BRANCH" \
            --title "Update Mage-OS target version to ${LATEST}" \
            --body "Mage-OS ${LATEST} is available on https://repo.mage-os.org/, the migration script still installs ${CURRENT}. This bumps \`TARGET_VERSION\` in \`migrate-to-mage-os.sh\`; \`BASE_VERSION\` stays at 2.3.0 because it is the skeleton the root-update plugin diffs against, not the version being installed. Merge once the migration test is green on this branch. Opened automatically by the daily version check."; then
            exit 0
          fi

          # Opening the pull request needs a permission this repository does not grant to Actions.
          # The branch IS pushed, so a human can finish it in one click via the compare link below.
          # This job deliberately keeps failing every day until the update lands, so the pending
          # upgrade stays visible instead of disappearing into a green run.
          compare="https://github.com/${GITHUB_REPOSITORY}/compare/${GITHUB_REF_NAME}...${BRANCH}?expand=1"

          {
            echo "## Mage-OS ${LATEST} is available, but the pull request could not be opened"
            echo
            echo "The branch \`${BRANCH}\` is pushed and contains the \`${CURRENT}\` -> \`${LATEST}\` bump."
            echo "Creating the pull request failed, almost certainly because of:"
            echo
            echo "> GitHub Actions is not permitted to create or approve pull requests"
            echo
            echo "### Open the pull request by hand (one click)"
            echo
            echo "${compare}"
            echo
            echo "### Or make this job do it, pick one"
            echo
            echo "1. A repository admin enables **Settings -> Actions -> General -> Workflow permissions -> Allow GitHub Actions to create and approve pull requests**."
            echo "   If that checkbox is greyed out, the organisation owner has to enable the same setting at **Organisation settings -> Actions -> General** first."
            echo "2. Or add a personal access token with the \`repo\` and \`workflow\` scopes as the repository secret \`MAGE_OS_UPDATE_TOKEN\`,"
            echo "   and change the \`GH_TOKEN\` of this step to \`\${{ secrets.MAGE_OS_UPDATE_TOKEN || github.token }}\`."
            echo "   This option also makes \`test-migration.yaml\` run on the pull request, which the default token cannot trigger."
            echo
            echo "Until one of these happens this job fails once a day on purpose."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error title=Cannot open the Mage-OS ${LATEST} pull request::The branch ${BRANCH} is pushed but Actions may not create pull requests in this repository.%0AOpen it by hand: ${compare}%0AOr let an admin enable 'Allow GitHub Actions to create and approve pull requests' (Settings -> Actions -> General), or add a PAT as the MAGE_OS_UPDATE_TOKEN secret.%0ASee the job summary for the full instructions."
          exit 1
